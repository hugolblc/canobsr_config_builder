name: R tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::DT
            any::shinyFiles
            any::readr
            any::readxl
            any::sf
            any::yaml
            any::testthat
      - name: Run schema tests
        shell: Rscript {0}
        run: source("scripts/tests/testthat.R")
