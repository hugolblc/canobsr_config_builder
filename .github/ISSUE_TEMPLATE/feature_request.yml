name: Feature request
description: Propose a change to the configuration contract or workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem to solve independently of a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected behaviour
      description: Include affected operations, files, validations, reports, and documentation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the change complete.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility or migration impact
      description: Explain how existing config folders and scripts should behave.
